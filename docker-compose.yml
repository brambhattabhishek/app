services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: algoforge-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      MONGO_URL: mongodb://mongo:27017
      SERVER_PORT: 8095
    ports:
      - "8095:8095"
    depends_on:
      - mongo

volumes:
  mongo_data: